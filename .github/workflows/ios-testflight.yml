name: Lexcoria TestFlight

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Draft release tag containing the Lexcoria native candidate
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the Lexcoria native candidate ZIP
        required: true
        type: string
      upload:
        description: Sign and upload after simulator compilation
        default: false
        type: boolean
      review_build:
        description: Submit Lexcoria build 100.82.1 for invitation-only Beta App Review
        default: false
        type: boolean
      internal_build:
        description: Enable Lexcoria build 100.87.1 for existing personal internal testing
        default: false
        type: boolean
      internal_only_upload:
        description: Upload a TestFlight Internal Only build
        default: false
        type: boolean

permissions:
  # GitHub requires write-role access to download unpublished drafts.
  contents: write

concurrency:
  group: lexcoria-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: ${{ !inputs.review_build && !inputs.internal_build }}
    runs-on: xcode-27
    environment: ios-testflight
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: D8L3PZ8Y72
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      LEXCORIA_BUNDLE_ID: com.smartelearning.lexcoria
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            variants/matharia/scripts
            variants/lexcoria/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the iOS build SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Device SDK: $sdk"
          [[ "$sdk" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          (( ${sdk%%.*} >= 27 ))
      - name: Fetch and verify native candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^lexcoria-ios-[A-Za-z0-9.-]+$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          dir="$RUNNER_TEMP/lexcoria"
          mkdir -p "$dir"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern lexcoria-native-candidate.zip --dir "$dir"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$dir/lexcoria-native-candidate.zip" | shasum -a 256 --check
          ditto -x -k "$dir/lexcoria-native-candidate.zip" "$dir"
          config="$dir/variants/lexcoria/native/ios/App/App/capacitor.config.json"
          [[ "$(plutil -extract appId raw -o - "$config")" == "$LEXCORIA_BUNDLE_ID" ]]
          [[ "$(plutil -extract appName raw -o - "$config")" == "Lexcoria" ]]
          if plutil -extract server.url raw -o - "$config" >/dev/null 2>&1; then
            echo 'Candidate must use bundled assets.' >&2
            exit 1
          fi
      - name: Verify Lexcoria launch, rotation and saved progress on iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lexcoria-simulator"
          mkdir -p "$dir"
          ditto -x -k "$RUNNER_TEMP/lexcoria/lexcoria-native-candidate.zip" "$dir"
          project="$dir/variants/lexcoria/native/ios/App"
          python3 variants/lexcoria/scripts/native-tests/prepare-project.py "$project"
          plutil -lint "$project/App.xcodeproj/project.pbxproj"
          device="$(xcrun simctl create 'Lexcoria QA' com.apple.CoreSimulator.SimDeviceType.iPhone-18-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-2)"
          trap 'xcrun simctl shutdown "$device" || true; xcrun simctl delete "$device" || true' EXIT
          result="$dir/LexcoriaSimulator.xcresult"
          status=0
          xcodebuild -project "$project/App.xcodeproj" -scheme LexcoriaNativeQA -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$dir/DerivedData" \
            -resultBundlePath "$result" -jobs 2 -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO test > "$dir/tests.log" 2>&1 || status=$?
          tail -100 "$dir/tests.log"
          [[ ! -d "$result" ]] || xcrun xcresulttool get test-results summary --path "$result" > "$dir/test-summary.json"
          [[ "$status" == 0 ]]
          jq -e '.totalTestCount == 3 and .passedTests == 3 and .failedTests == 0 and .skippedTests == 0' "$dir/test-summary.json"
          cat "$dir/test-summary.json"
          app="$dir/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          [[ "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" == "$LEXCORIA_BUNDLE_ID" ]]
          [[ "$(plutil -extract MinimumOSVersion raw -o - "$app/Info.plist")" == '15.0' ]]
          test -f "$app/public/index.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lexcoria-sdk27-simulator-tests
          path: |
            ${{ runner.temp }}/lexcoria-simulator/tests.log
            ${{ runner.temp }}/lexcoria-simulator/test-summary.json
      - name: Verify Apple record and upload build
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          LEXCORIA_INTERNAL_ONLY: ${{ inputs.internal_only_upload }}
        run: node variants/lexcoria/scripts/upload-testflight.mjs "$RUNNER_TEMP/lexcoria"
  beta-review:
    if: inputs.review_build || inputs.internal_build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: ios-testflight
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            variants/matharia/scripts
            variants/lexcoria/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and configure Lexcoria TestFlight
        env:
          APPLE_TEAM_ID: D8L3PZ8Y72
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          LEXCORIA_INTERNAL_BUILD: ${{ inputs.internal_build }}
        run: node variants/lexcoria/scripts/submit-beta-review.mjs
