name: Lexcoria TestFlight

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Draft release tag containing the Lexcoria native candidate
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 of the Lexcoria native candidate ZIP
        required: true
        type: string
      upload:
        description: Sign and upload after simulator compilation
        default: false
        type: boolean
      review_build:
        description: Submit Lexcoria build 100.82.1 for invitation-only Beta App Review
        default: false
        type: boolean

permissions:
  # GitHub requires write-role access to download unpublished drafts.
  contents: write

concurrency:
  group: lexcoria-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: ${{ !inputs.review_build }}
    runs-on: macos-15-intel
    environment: ios-testflight
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: D8L3PZ8Y72
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEXCORIA_BUNDLE_ID: com.smartelearning.lexcoria
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            variants/matharia/scripts
            variants/lexcoria/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and verify native candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_TAG" =~ ^lexcoria-ios-[A-Za-z0-9.-]+$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          dir="$RUNNER_TEMP/lexcoria"
          mkdir -p "$dir"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern lexcoria-native-candidate.zip --dir "$dir"
          printf '%s  %s\n' "$CANDIDATE_SHA256" "$dir/lexcoria-native-candidate.zip" | shasum -a 256 --check
          ditto -x -k "$dir/lexcoria-native-candidate.zip" "$dir"
          config="$dir/variants/lexcoria/native/ios/App/App/capacitor.config.json"
          [[ "$(plutil -extract appId raw -o - "$config")" == "$LEXCORIA_BUNDLE_ID" ]]
          [[ "$(plutil -extract appName raw -o - "$config")" == "Lexcoria" ]]
          if plutil -extract server.url raw -o - "$config" >/dev/null 2>&1; then
            echo 'Candidate must use bundled assets.' >&2
            exit 1
          fi
      - name: Compile Lexcoria for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lexcoria"
          result="$dir/LexcoriaSimulator.xcresult"
          if ! xcodebuild -project "$dir/variants/lexcoria/native/ios/App/App.xcodeproj" \
            -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$dir/DerivedData" -resultBundlePath "$result" -jobs 2 \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CODE_SIGNING_ALLOWED=NO -quiet build; then
            if [[ -d "$result" ]]; then
              xcrun xcresulttool get build-results --path "$result" || true
            fi
            exit 1
          fi
          app="$dir/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          [[ "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" == "$LEXCORIA_BUNDLE_ID" ]]
          test -f "$app/public/index.html"
      - name: Verify Apple record and upload external-eligible build
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: node variants/lexcoria/scripts/upload-testflight.mjs "$RUNNER_TEMP/lexcoria"
  beta-review:
    if: inputs.review_build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: ios-testflight
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            variants/matharia/scripts
            variants/lexcoria/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and submit Lexcoria closed beta
        env:
          APPLE_TEAM_ID: D8L3PZ8Y72
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: node variants/lexcoria/scripts/submit-beta-review.mjs
