name: Release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run lint
      - name: Safe account return links
        run: npm run verify:return-path
      - name: Maths content and five-tier difficulty
        run: |
          npx tsx scripts/verify-sats-content.ts
          npx tsx scripts/verify-sats-question-integrity.ts
          npx tsx scripts/verify-recommended-practice.ts
          node scripts/verify-five-tier-difficulty.mjs
          node scripts/verify-reasoning-quest-content.mjs
          npx tsx scripts/verify-angle-question-variety.ts
          npx tsx scripts/verify-order-ops-engine.ts
          npx tsx scripts/verify-game-sound-profiles.ts
      - name: Production build
        run: npm run build
      - name: Database rules and migrations
        run: |
          npm run verify:family-db
          npm run verify:admin-db
          npm run verify:production-db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Backend typecheck and unit tests
        working-directory: supabase/functions
        run: |
          deno check billing/index.ts stripe-webhook/index.ts send-parent-reports/index.ts admin-support/index.ts
          deno test -A _shared/billing_test.ts
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Start compiled website for security-header checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/sats-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/sats-preview.log
          exit 1
      - name: Website security policy
        run: node scripts/verify-parent-site-security.mjs
      - name: Production paywall fails closed
        run: node scripts/verify-paywall-fail-closed.mjs
      - name: Start website for viewport checks
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/sats-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/sats-vite.log
          exit 1
      - name: Phone, tablet and desktop viewport checks
        run: |
          npm run verify:responsive
          LEGEND_QA_URL=http://127.0.0.1:3000 npm run verify:screen-overlaps
          npm run verify:critical-game-viewports
          npm run verify:lexcoria
          npm run verify:family-ui
      - name: SATs mock, on-screen working and scored progression
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
          SATS_TEST_BASE_URL: http://127.0.0.1:3000
          LEGEND_QA_URL: http://127.0.0.1:3000
        run: |
          node scripts/verify-sats-mock-flow.mjs
          node scripts/verify-game-audio.mjs
          node scripts/verify-per-game-audio.mjs
          node scripts/verify-recorded-sfx.mjs
          node scripts/verify-engine-cues.mjs
          node scripts/verify-daily-quests-and-core-mastery.mjs
          node scripts/verify-on-screen-working.mjs
          node scripts/verify-scored-progression.mjs
          node scripts/verify-game-result-settlement.mjs
          node scripts/verify-untracked-accuracy.mjs
          node scripts/verify-quest-reward-once.mjs
          node scripts/verify-zero-currency-persistence.mjs
          node scripts/verify-adventure-settings.mjs
          node scripts/verify-zombie-hidden-time.mjs
          node scripts/verify-zombie-targeting.mjs
          node scripts/verify-area-architect-layout.mjs
          node scripts/verify-order-ops-interaction.mjs
          node scripts/verify-change-counter-till.mjs
          node scripts/verify-factor-frenzy-feedback.mjs
          node scripts/verify-visual-game-answer-events.mjs
          node scripts/verify-graph-grabber-layout.mjs
          node scripts/verify-match-mastery-phone.mjs
          node scripts/verify-primary-game-text.mjs
          node scripts/verify-potion-panic-targets.mjs
          node scripts/verify-all-minigames-smoke.mjs
          node scripts/verify-ratio-racer-reachability.mjs
          node scripts/verify-remainder-group-legibility.mjs
          node scripts/verify-place-value-phone-layout.mjs
          node scripts/verify-practice-results-layout.mjs
      - name: Calm Grove interactions
        env:
          WELLBEING_QA_URL: http://127.0.0.1:3000
        run: node scripts/verify-wellbeing-activities.mjs
      - name: Upload game and viewport diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-viewport-diagnostics
          path: |
            qa-artifacts/responsive-experience/
            qa-artifacts/screen-overlaps/
            qa-artifacts/final-functional-smoke/
          if-no-files-found: ignore
      - name: Start account-flow fixture site
        run: |
          VITE_SUPABASE_URL=https://family-qa.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_fixture npm run dev -- --port 4180 --host 127.0.0.1 > /tmp/sats-family-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4180/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/sats-family-vite.log
          exit 1
      - name: Parent signup, checkout and saved progress fixture
        run: npm run verify:family-auth
      - name: Build website with pinned Lexcoria game
        env:
          VITE_SUPABASE_URL: https://family-qa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
        run: npm run build:cloudflare-english-test
      - name: Start combined artifact preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4181 --strictPort > /tmp/sats-combined-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4181/english/play/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/sats-combined-preview.log
          exit 1
      - name: Verify gated Lexcoria route and unavailable checkout
        env:
          LEGEND_QA_URL: http://127.0.0.1:4181
          LEGEND_ENGLISH_TESTING: 'true'
        run: npm run verify:lexcoria
