project_id = "sats-legends"

[functions.billing]
# JWT is verified explicitly with Auth.getUser for every authenticated action.
verify_jwt = false

[functions.stripe-webhook]
# Stripe signature validation replaces JWT authentication here.
verify_jwt = false

[functions.send-parent-reports]
# Private scheduler secret is verified before touching data.
verify_jwt = false

[functions.admin-support]
# The function validates the parent's JWT and staff membership itself.
verify_jwt = false

[functions.native-account-delete]
# The handler validates the caller, recent reauthentication and Apple revocation
# before performing server-only deletion of that same identity.
verify_jwt = false
